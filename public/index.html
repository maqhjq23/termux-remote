<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Termux Remote</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0f19;--bg2:#111827;--card:#1a2332;--border:#1e3048;--text:#e2e8f0;--text2:#94a3b8;--dim:#475569;--green:#10b981;--green2:#34d399;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--cyan:#06b6d4}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideR{from{transform:translateX(110%)}to{transform:translateX(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 6px var(--green)}50%{box-shadow:0 0 18px var(--green)}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

#toasts{position:fixed;top:44px;right:8px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:8px 14px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:6px;pointer-events:auto;animation:slideR .25s ease;box-shadow:0 6px 20px rgba(0,0,0,.4);backdrop-filter:blur(8px);max-width:340px}
.toast.g{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--green2)}
.toast.r{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.toast.y{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--yellow)}
.toast.b{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:var(--blue)}
.toast.out{animation:slideR .2s ease reverse forwards}

#bar{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;transition:.3s}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:glow 2s infinite}
.dot.w{background:var(--yellow);animation:pulse 1s infinite}
.logo{font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:5px}
.logo i{-webkit-text-fill-color:var(--green);font-size:12px}
#lbl{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tbtn{background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:10px;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;transition:.15s}
.tbtn:hover{background:var(--card);color:var(--text)}
.tbtn.on{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.3);color:var(--green2)}

#wrap{height:calc(100vh - 36px);position:relative}
#term{width:100%;height:100%;padding:2px 0}
.xterm{height:100%}
.xterm-viewport::-webkit-scrollbar{width:4px}
.xterm-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#ov{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;transition:opacity .3s,visibility .3s}
#ov.off{opacity:0;visibility:hidden;pointer-events:none}
#ov::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(16,185,129,.05) 0%,transparent 70%);pointer-events:none}

#panel{text-align:center;padding:28px;max-width:380px;width:90%;animation:fadeUp .5s ease;position:relative;z-index:1}
.p-icon{width:60px;height:60px;margin:0 auto 16px;border-radius:14px;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(6,182,212,.08));border:1px solid rgba(16,185,129,.15);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--green)}
#panel h2{font-size:20px;font-weight:700;margin-bottom:3px;letter-spacing:-.3px}
#panel h2 span{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--dim);font-size:12px;margin-bottom:20px}
.fg{margin-bottom:14px;text-align:left}
.fg label{display:block;font-size:10px;color:var(--text2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.fg input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;transition:border .2s}
.fg input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(16,185,129,.1)}
.btn{padding:10px 24px;background:linear-gradient(135deg,var(--green),#059669);color:#fff;border:none;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 4px 12px rgba(16,185,129,.2)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,185,129,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.st{text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:4px}
.si{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--bg2);border:1px solid transparent;transition:.2s}
.si.ok{border-color:rgba(16,185,129,.2);color:var(--green2)}
.si.fail{border-color:rgba(239,68,68,.2);color:var(--red)}
.si.wait{border-color:rgba(245,158,11,.2);color:var(--yellow)}
.si i{width:14px;text-align:center;font-size:10px}
.hint{margin-top:16px;font-size:10px;color:var(--dim);line-height:1.6}
.hint code{background:var(--card);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--cyan);border:1px solid var(--border)}

#kb{display:none;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:4px}
#kb.show{display:block}
.kr{display:flex;justify-content:center;gap:2px;margin-bottom:2px}
.k{min-width:28px;height:30px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text2);font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.08s;padding:0 4px;flex-shrink:0}
.k:active{background:var(--green);color:#fff;border-color:var(--green);transform:scale(.9)}
.k.s{background:var(--bg);color:var(--cyan);font-weight:600}
.k.s.on{background:rgba(6,182,212,.15);border-color:var(--cyan)}
.k.w{min-width:44px}.k.xw{min-width:64px}

@media(max-width:600px){.k{min-width:24px;height:26px;font-size:8px}.k.s{font-size:8px}#panel{padding:20px}#panel h2{font-size:17px}.p-icon{width:48px;height:48px;font-size:20px}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="bar">
  <div class="dot" id="dot"></div>
  <span class="logo"><i class="fas fa-terminal"></i> Termux</span>
  <span id="lbl">-</span>
  <button class="tbtn" id="bK" onclick="togKB()"><i class="fas fa-keyboard"></i> Keys</button>
  <button class="tbtn" onclick="fit()"><i class="fas fa-expand"></i></button>
</div>
<div id="wrap">
  <div id="term"></div>
  <div id="ov">
    <div id="panel">
      <div class="p-icon"><i class="fas fa-satellite-dish"></i></div>
      <h2>Termux <span>Remote</span></h2>
      <p class="sub">Control your Termux from any browser</p>
      <div class="fg"><label>Auth Token</label><input type="text" id="tkI" value="termux-remote-2024"></div>
      <button class="btn" id="cB" onclick="go()"><i class="fas fa-plug" id="cI"></i> <span id="cT">Connect</span></button>
      <div class="st" id="st"></div>
      <div class="hint">Token = AUTH_TOKEN on Railway<br>Termux: <code>bash ~/start_remote.sh</code></div>
    </div>
  </div>
</div>
<div id="kb">
  <div class="kr">
    <div class="k s" onclick="sk('Escape')">ESC</div><div class="k s" onclick="sk('Tab')">TAB</div>
    <div class="k s" data-m="ctrl" onclick="tm('ctrl',this)">Ctrl</div><div class="k s" data-m="alt" onclick="tm('alt',this)">Alt</div>
    <div class="k w" onclick="sk('Backspace')"><i class="fas fa-delete-left"></i></div>
    <div class="k s" onclick="sk('End')">End</div><div class="k s" onclick="sk('Home')">Home</div>
    <div class="k s" onclick="sk('PageUp')">PgUp</div><div class="k s" onclick="sk('PageDown')">PgDn</div>
  </div>
  <div class="kr">
    <div class="k s" onclick="sk('F1')">F1</div><div class="k s" onclick="sk('F2')">F2</div><div class="k s" onclick="sk('F3')">F3</div><div class="k s" onclick="sk('F4')">F4</div>
    <div class="k s" onclick="sk('F5')">F5</div><div class="k s" onclick="sk('F6')">F6</div><div class="k s" onclick="sk('F7')">F7</div><div class="k s" onclick="sk('F8')">F8</div>
    <div class="k s" onclick="sk('F9')">F9</div><div class="k s" onclick="sk('F10')">F10</div>
  </div>
  <div class="kr">
    <div class="k s" onclick="sk('F11')">F11</div><div class="k s" onclick="sk('F12')">F12</div>
    <div class="k s" onclick="sk('Insert')">Ins</div><div class="k s" onclick="sk('Delete')">Del</div>
    <div class="k" onclick="sk('`')">`</div><div class="k" onclick="sk('~')">~</div><div class="k" onclick="sk('|')">|</div><div class="k" onclick="sk('\\')">\\</div>
  </div>
  <div class="kr">
    <div class="k" onclick="sk('ArrowUp')"><i class="fas fa-arrow-up"></i></div>
    <div class="k" onclick="sk('ArrowDown')"><i class="fas fa-arrow-down"></i></div>
    <div class="k" onclick="sk('ArrowLeft')"><i class="fas fa-arrow-left"></i></div>
    <div class="k" onclick="sk('ArrowRight')"><i class="fas fa-arrow-right"></i></div>
    <div class="k xw s" onclick="sk('Enter')">Enter</div><div class="k w" onclick="sk(' ')">Space</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xtermAddonFit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xtermAddonWebLinks.min.js"></script>
<script>
var ws=null,term=null,fitA=null,alive=false,hasDev=false,devName="";
var mods={ctrl:0,alt:0},rTmr=null,rCnt=0;
var $=function(id){return document.getElementById(id)};

function toast(m,t,dur){
  var e=document.createElement('div');
  e.className='toast '+({ok:'g',err:'r',warn:'y',info:'b'}[t]||'b');
  var ic={ok:'circle-check',err:'circle-xmark',warn:'triangle-exclamation',info:'circle-info'};
  e.innerHTML='<i class="fas fa-'+(ic[t]||'circle-info')+'"></i><span>'+m+'</span>';
  $('toasts').appendChild(e);
  if(dur){setTimeout(function(){e.classList.add('out');setTimeout(function(){e.remove()},250)},dur)}
}

function sDot(c,t){$('dot').className='dot'+(c?' '+c:'');$('lbl').textContent=t}
function sBtn(t,ic,dis){$('cT').textContent=t;$('cI').className='fas '+ic;$('cB').disabled=!!dis}
function sStatus(html){$('st').innerHTML=html}

function initTerm(){
  term=new Terminal({
    theme:{background:'#0b0f19',foreground:'#e2e8f0',cursor:'#10b981',cursorAccent:'#0b0f19',selectionBackground:'rgba(16,185,129,.2)',black:'#1e293b',red:'#ef4444',green:'#10b981',yellow:'#f59e0b',blue:'#3b82f6',magenta:'#a78bfa',cyan:'#06b6d4',white:'#e2e8f0',brightBlack:'#475569',brightRed:'#f87171',brightGreen:'#34d399',brightYellow:'#fbbf24',brightBlue:'#60a5fa',brightMagenta:'#c4b5fd',brightCyan:'#22d3ee',brightWhite:'#f8fafc'},
    fontFamily:"'JetBrains Mono',monospace",fontSize:14,cursorBlink:true,cursorStyle:'block',scrollback:5000,allowProposedApi:true
  });
  fitA=new FitAddon.FitAddon();
  term.loadAddon(fitA);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());
  term.open($('term'));
  fitA.fit();
  term.onData(function(d){if(alive&&hasDev)ws.send(JSON.stringify({t:'i',d:d}))});
  term.onResize(function(e){if(alive&&hasDev)ws.send(JSON.stringify({t:'r',c:e.cols,rows:e.rows}))});
  window.addEventListener('resize',function(){if(fitA)fitA.fit()});
  term.writeln('\x1b[38;2;16;185;129m  Termux Remote v9\x1b[0m\n');
}

function doConnect(){
  if(ws)try{ws.close()}catch(e){}
  alive=false;hasDev=false;devName="";

  var proto=location.protocol==='https:'?'wss:':'ws:';
  var url=proto+'//'+location.host+'/ws/b';

  sDot('w','Connecting...');
  sBtn('Connecting...','circle-notch fa-spin',true);
  sStatus('<div class="si wait"><i class="fas fa-circle-dot fa-spin"></i> Connecting to server...</div>');

  try{ws=new WebSocket(url)}catch(e){
    sStatus('<div class="si fail"><i class="fas fa-circle-xmark"></i> '+e.message+'</div>');
    toast('WebSocket failed','err',5000);scheduleRetry();return;
  }

  var timer=setTimeout(function(){
    if(!alive){
      try{ws.close()}catch(e){}
      sDot('','Timeout');sBtn('Retry','fa-rotate');
      sStatus('<div class="si fail"><i class="fas fa-circle-xmark"></i> Connection timeout</div>');
      toast('Timeout','err');scheduleRetry();
    }
  },10000);

  ws.onopen=function(){
    clearTimeout(timer);
    alive=true;rCnt=0;
    sDot('w','Server OK');
    sBtn('Waiting for device...','fa-magnifying-glass',false);
    sStatus('<div class="si ok"><i class="fas fa-check"></i> Server connected</div><div class="si wait"><i class="fas fa-circle-dot fa-spin"></i> Waiting for Termux device...</div>');
  };

  ws.onmessage=function(ev){
    try{handleMsg(JSON.parse(ev.data))}catch(e){console.error(e)}
  };

  ws.onclose=function(ev){
    clearTimeout(timer);alive=false;
    if(hasDev){
      hasDev=false;devName="";
      sDot('w','Device lost');
      $('ov').classList.remove('off');
      sStatus('<div class="si ok"><i class="fas fa-check"></i> Server OK</div><div class="si fail"><i class="fas fa-circle-xmark"></i> Device disconnected</div>');
      toast('Device disconnected','warn');
      if(term)term.writeln('\r\n\x1b[33m[!] Device disconnected\x1b[0m\r\n');
    }else{
      sDot('','Disconnected');
      sStatus('<div class="si fail"><i class="fas fa-circle-xmark"></i> Disconnected (code '+ev.code+')</div>');
    }
    scheduleRetry();
  };

  ws.onerror=function(){};
}

function handleMsg(m){
  if(m.t==='waiting'){
    sDot('w','No device');sBtn('Waiting...','fa-magnifying-glass',false);
    sStatus('<div class="si ok"><i class="fas fa-check"></i> Server connected</div><div class="si fail"><i class="fas fa-circle-xmark"></i> No Termux device</div><div class="hint" style="margin-top:8px">Run on Termux: <code>bash ~/start_remote.sh</code></div>');
  }
  else if(m.t==='connected'){
    hasDev=true;devName=m.name||'Termux';
    sDot('on',devName);sBtn('Connected','fa-check',false);
    $('ov').classList.add('off');
    toast('Connected: '+devName,'ok');
    if(term){term.writeln('\x1b[32m[OK] '+devName+'\x1b[0m\n')}
    setTimeout(function(){if(term&&fitA){fitA.fit();ws.send(JSON.stringify({t:'r',c:term.cols,rows:term.rows}))}},400);
  }
  else if(m.t==='disconnected'){
    hasDev=false;devName="";
    sDot('w','Device lost');
    $('ov').classList.remove('off');
    sStatus('<div class="si ok"><i class="fas fa-check"></i> Server OK</div><div class="si fail"><i class="fas fa-circle-xmark"></i> Device disconnected</div>');
    toast('Device disconnected','warn');
    if(term)term.writeln('\r\n\x1b[33m[!] Device disconnected\x1b[0m\r\n');
  }
  else if(m.t==='o' && term){
    term.write(m.d);
  }
  else if(m.t==='res'){
    if(m.d && m.d.success===false){toast(m.d.error||'Error','err')}
    else if(m.d && m.d.success){toast('OK','ok',2000)}
  }
  else if(m.t==='fd'){
    var d=m.d;if(!d)return;
    var b=new Blob([atob(d.content)],{type:'application/octet-stream'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.filename||'file';a.click();
    URL.revokeObjectURL(a.href);toast('Downloaded','ok');
  }
}

function scheduleRetry(){
  rCnt++;var d=Math.min(2000+rCnt*1000,10000);
  sDot('','Retry '+Math.ceil(d/1000)+'s');
  sBtn('Retry '+Math.ceil(d/1000)+'s','fa-circle-notch fa-spin',true);
  clearTimeout(rTmr);
  rTmr=setTimeout(doConnect,d);
}

function go(){rCnt=0;clearTimeout(rTmr);doConnect()}
function fit(){if(fitA)setTimeout(function(){fitA.fit()},50)}

/* Virtual KB */
function togKB(){$('kb').classList.toggle('show');$('bK').classList.toggle('on');if($('kb').classList.contains('show'))setTimeout(fit,80)}
function tm(m,el){mods[m]=!mods[m];el.classList.toggle('on',mods[m])}
function sk(key){
  if(!alive||!hasDev){toast('No device','warn',1500);return}
  var c=mods.ctrl,a=mods.alt;mods.ctrl=mods.alt=false;
 document.querySelectorAll('.k[data-m]').forEach(function(e){e.classList.remove('on')});
  var s='';
  if(c||a){var map={a:'\x01',b:'\x02',c:'\x03',d:'\x04',e:'\x05',f:'\x06',g:'\x07',h:'\x08',i:'\x09',j:'\x0a',k:'\x0b',l:'\x0c',m:'\x0d',n:'\x0e',o:'\x0f',p:'\x10',q:'\x11',r:'\x12',s:'\x13',t:'\x14',u:'\x15',v:'\x16',w:'\x17',x:'\x18',y:'\x19',z:'\x1a','[':'\x1b',']':'\x1d',"\\":'\x1c','/':'\x1f',' ':'\x00','_':'\x1f'};var k=key.length===1?key.toLowerCase():null;if(c&&k&&map[k])s=map[k];else s=key}
  else{var q={Escape:'\x1b',Tab:'\t',Backspace:'\x7f',Delete:'\x1b[3~',Home:'\x1b[H',End:'\x1b[F',PageUp:'\x1b[5~',PageDown:'\x1b[6~',Insert:'\x1b[2~',Enter:'\r',ArrowUp:'\x1b[A',ArrowDown:'\x1b[B',ArrowLeft:'\x1b[D',ArrowRight:'\x1b[C',F1:'\x1bOP',F2:'\x1bOQ',F3:'\x1bOR',F4:'\x1bOS',F5:'\x1b[15~',F6:'\x1b[17~',F7:'\x1b[18~',F8:'\x1b[19~',F9:'\x1b[20~',F10:'\x1b[21~',F11:'\x1b[23~',F12:'\x1b[24~'};s=q[key]||key}
  ws.send(JSON.stringify({t:'i',d:s}));
}

window.addEventListener('DOMContentLoaded',function(){
  initTerm();
  $('tkI').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!alive&&rCnt>0){clearTimeout(rTmr);doConnect()}});
});
</script>
</body>
</html>
