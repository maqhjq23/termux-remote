<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Termux Remote</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--sf:#161b22;--sf2:#1c2128;--bd:#30363d;--tx:#e6edf3;--dm:#8b949e;--gn:#3fb950;--rd:#f85149;--yl:#d29922;--bl:#58a6ff}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Fira Code','Consolas',monospace;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse2{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--gn)}50%{box-shadow:0 0 14px var(--gn)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastSlide{from{transform:translateX(120%)}to{transform:translateX(0)}}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--gn);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
#toasts{position:fixed;top:40px;right:8px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:8px 12px;border-radius:5px;font-size:11px;font-family:inherit;display:flex;align-items:center;gap:6px;pointer-events:auto;animation:toastSlide .2s;box-shadow:0 3px 10px rgba(0,0,0,.5);max-width:340px}
.toast.g{background:var(--sf2);border:1px solid var(--gn);color:var(--gn)}.toast.r{background:var(--sf2);border:1px solid var(--rd);color:var(--rd)}.toast.y{background:var(--sf2);border:1px solid var(--yl);color:var(--yl)}.toast.b{background:var(--sf2);border:1px solid var(--bl);color:var(--bl)}
#bar{height:32px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0}
#bar .l{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rd);flex-shrink:0;transition:.3s}
.dot.on{background:var(--gn);animation:glow 2s infinite}.dot.w{background:var(--yl);animation:pulse2 1s infinite}
#bar .r{display:flex;gap:4px;flex-shrink:0}
#bar button{background:var(--bd);border:none;color:var(--tx);padding:3px 7px;border-radius:3px;cursor:pointer;font-size:10px;font-family:inherit;display:flex;align-items:center;gap:3px;transition:.15s}
#bar button:hover{background:#484f58}#bar button.on{background:var(--gn);color:#000}
#lbl{font-size:11px;color:var(--dm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wrap{display:flex;height:calc(100vh - 32px);position:relative}
#tw{flex:1;position:relative;overflow:hidden}
#term{width:100%;height:100%;padding:2px 0}
.xterm{height:100%}
.xterm-viewport::-webkit-scrollbar{width:5px}.xterm-viewport::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
/* Overlay */
#ov{position:absolute;inset:0;background:rgba(13,17,23,.97);z-index:30;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#ov.off{opacity:0;pointer-events:none}
#ob{text-align:center;padding:24px;max-width:360px;width:92%;animation:fadeIn .4s}
#ob .ic{font-size:40px;color:var(--gn);margin-bottom:12px}
#ob h2{font-size:18px;margin-bottom:4px}
#ob .sub{color:var(--dm);font-size:12px;margin-bottom:18px}
.fg{margin-bottom:12px;text-align:left}
.fg label{display:block;font-size:10px;color:var(--dm);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fg input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:8px 10px;border-radius:4px;font-family:inherit;font-size:12px;outline:none;transition:.2s}
.fg input:focus{border-color:var(--gn)}
.btn{padding:10px 24px;background:var(--gn);color:#000;border:none;border-radius:4px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.st{text-align:left;margin-top:14px;font-size:11px;color:var(--dm);line-height:1.8}
.st div{display:flex;align-items:center;gap:6px}
.st i{width:14px;text-align:center;font-size:11px}
.st .ok{color:var(--gn)}.st .fail{color:var(--rd)}.st .wait{color:var(--yl)}
.hint{margin-top:14px;font-size:10px;color:var(--dm);line-height:1.6}
.hint code{background:var(--bg);padding:1px 4px;border-radius:2px}
/* File panel */
#fp{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--sf);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
#fp.open{transform:translateX(0)}
#fp .hd{height:34px;background:var(--sf2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;justify-content:space-between;flex-shrink:0}
#fp .hd h3{font-size:12px}#fp .hd button{background:none;border:none;color:var(--dm);cursor:pointer;font-size:14px}
#fp .tb{height:32px;background:var(--sf2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 6px;gap:4px;flex-shrink:0}
#fp .tb input{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:3px 6px;border-radius:3px;font-size:11px;font-family:inherit;outline:none;min-width:0}
#fp .tb input:focus{border-color:var(--gn)}
#fp .tb button{background:var(--bd);border:none;color:var(--tx);padding:2px 5px;border-radius:3px;cursor:pointer;font-size:10px}
#fp .tb button:hover{background:#484f58}
#fp .bd{flex:1;overflow-y:auto;padding:2px 0}
.fi{display:flex;align-items:center;padding:5px 10px;cursor:pointer;transition:.1s;border-left:2px solid transparent}
.fi:hover{background:rgba(255,255,255,.04)}
.fi i{width:16px;text-align:center;margin-right:6px;font-size:12px}
.fi .fn{flex:1;font-size:11px;word-break:break-all;min-width:0}
.fi .fs{font-size:10px;color:var(--dm);margin-left:4px}
.fp-l{display:flex;align-items:center;justify-content:center;padding:20px;color:var(--dm);gap:6px;font-size:11px}
/* Modal */
#mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center}
#mbg.show{display:flex}
#mdl{background:var(--sf);border:1px solid var(--bd);border-radius:6px;width:90%;max-width:460px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
#mdl .mh{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
#mdl .mh h3{font-size:12px}#mdl .mh button{background:none;border:none;color:var(--dm);cursor:pointer;font-size:16px}
#mdl .mbo{padding:12px;flex:1;overflow-y:auto}
#mdl textarea{width:100%;height:260px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:6px;border-radius:3px;font-family:inherit;font-size:11px;resize:vertical;outline:none}
#mdl textarea:focus{border-color:var(--gn)}
#mdl .mf{padding:10px 12px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:6px}
#mdl .mf button{padding:5px 12px;border-radius:3px;border:none;cursor:pointer;font-family:inherit;font-size:11px}
.bsv{background:var(--gn);color:#000}.bcl{background:var(--bd);color:var(--tx)}
/* Keyboard */
#kb{display:none;height:auto;max-height:36vh;background:var(--sf);border-top:1px solid var(--bd);flex-shrink:0;overflow-y:auto;padding:4px}
#kb.show{display:block}
.kr{display:flex;justify-content:center;gap:3px;margin-bottom:3px}
.k{min-width:28px;height:32px;background:#21262d;border:1px solid var(--bd);border-radius:3px;color:var(--tx);font-size:10px;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.08s;padding:0 5px;flex-shrink:0}
.k:active{background:var(--gn);color:#000;border-color:var(--gn);transform:scale(.93)}
.k.s{background:#1c2128;color:var(--gn);font-weight:600;font-size:10px}.k.s.on{background:var(--gn);color:#000}
.k.w{min-width:46px}.k.xw{min-width:68px}
@media(max-width:600px){#fp{width:100%}.k{min-width:24px;height:28px;font-size:9px}.k.s{font-size:9px}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="bar">
  <div class="l">
    <div class="dot" id="dot"></div>
    <span style="font-size:12px;font-weight:600;color:var(--gn)"><i class="fas fa-terminal"></i> Termux</span>
    <span id="lbl">-</span>
  </div>
  <div class="r">
    <button id="bK" onclick="togKB()"><i class="fas fa-keyboard"></i> Keys</button>
    <button id="bF" onclick="togFP()"><i class="fas fa-folder"></i> Files</button>
    <button onclick="fit()"><i class="fas fa-expand"></i></button>
  </div>
</div>
<div id="wrap">
  <div id="tw">
    <div id="term"></div>
    <div id="ov">
      <div id="ob">
        <div class="ic"><i class="fas fa-satellite-dish"></i></div>
        <h2>Termux Remote</h2>
        <p class="sub">Real-time terminal from browser</p>
        <div class="fg"><label>Auth Token</label><input type="text" id="tkI" value="termux-remote-2024"></div>
        <button class="btn" id="cB" onclick="go()"><i class="fas fa-plug"></i> <span id="cT">Connect</span></button>
        <div class="st" id="st"></div>
        <div class="hint" id="ht">Token = AUTH_TOKEN on Railway. Termux: <code>bash ~/start_remote.sh</code></div>
      </div>
    </div>
  </div>
  <div id="fp">
    <div class="hd"><h3><i class="fas fa-folder-open"></i> Files</h3><button onclick="togFP()"><i class="fas fa-times"></i></button></div>
    <div class="tb">
      <input id="fpP" value="~" placeholder="Path">
      <button onclick="fl()"><i class="fas fa-sync-alt"></i></button>
      <button onclick="ff()"><i class="fas fa-search"></i></button>
      <button onclick="fn('..')"><i class="fas fa-level-up-alt"></i></button>
      <button onclick="fu()"><i class="fas fa-upload"></i></button>
      <button onclick="fc()"><i class="fas fa-plus"></i></button>
    </div>
    <div class="bd" id="fpB"></div>
  </div>
</div>
<div id="kb">
  <div class="kr">
    <div class="k s" onclick="sk('Escape')">ESC</div><div class="k s" onclick="sk('Tab')">TAB</div>
    <div class="k s" data-m="ctrl" onclick="tm('ctrl',this)">Ctrl</div><div class="k s" data-m="alt" onclick="tm('alt',this)">Alt</div>
    <div class="k w" onclick="sk('Backspace')"><i class="fas fa-delete-left"></i></div>
    <div class="k s" onclick="sk('End')">End</div><div class="k s" onclick="sk('Home')">Home</div>
    <div class="k s" onclick="sk('PageUp')">PgUp</div><div class="k s" onclick="sk('PageDown')">PgDn</div>
  </div>
  <div class="kr">
    <div class="k s" onclick="sk('F1')">F1</div><div class="k s" onclick="sk('F2')">F2</div><div class="k s" onclick="sk('F3')">F3</div><div class="k s" onclick="sk('F4')">F4</div>
    <div class="k s" onclick="sk('F5')">F5</div><div class="k s" onclick="sk('F6')">F6</div><div class="k s" onclick="sk('F7')">F7</div><div class="k s" onclick="sk('F8')">F8</div><div class="k s" onclick="sk('F9')">F9</div><div class="k s" onclick="sk('F10')">F10</div>
  </div>
  <div class="kr">
    <div class="k s" onclick="sk('F11')">F11</div><div class="k s" onclick="sk('F12')">F12</div>
    <div class="k s" onclick="sk('Insert')">Ins</div><div class="k s" onclick="sk('Delete')">Del</div>
    <div class="k" onclick="sk('`')">`</div><div class="k" onclick="sk('~')">~</div><div class="k" onclick="sk('|')">|</div><div class="k" onclick="sk('\\')">\\</div>
  </div>
  <div class="kr">
    <div class="k" onclick="sk('ArrowUp')"><i class="fas fa-arrow-up"></i></div><div class="k" onclick="sk('ArrowDown')"><i class="fas fa-arrow-down"></i></div>
    <div class="k" onclick="sk('ArrowLeft')"><i class="fas fa-arrow-left"></i></div><div class="k" onclick="sk('ArrowRight')"><i class="fas fa-arrow-right"></i></div>
    <div class="k xw s" onclick="sk('Enter')">Enter</div><div class="k w" onclick="sk(' ')">Space</div>
  </div>
</div>
<div id="mbg" onclick="if(event.target===this)cm()">
  <div id="mdl">
    <div class="mh"><h3 id="mT">Edit</h3><button onclick="cm()">&times;</button></div>
    <div class="mbo"><textarea id="mTa"></textarea></div>
    <div class="mf"><button class="bcl" onclick="cm()">Cancel</button><button class="bsv" id="mSv" onclick="ms()">Save</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xtermAddonFit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xtermAddonWebLinks.min.js"></script>
<script>
/* ===== STATE ===== */
let ws=null,term=null,fitA=null,devId=null,tk='termux-remote-2024';
let mods={ctrl:0,alt:0},pend={},rc=0,curPath=null;
let alive=false,hasDev=false;
let rTmr=null,rCnt=0,pollTmr=null;
const $=id=>document.getElementById(id);

/* ===== TOAST ===== */
function toast(m,t,b){const e=document.createElement('div');e.className='toast '+({ok:'g',err:'r',warn:'y',info:'b'}[t]||'b');e.innerHTML='<i class="fas fa-'+({ok:'circle-check',err:'circle-xmark',warn:'triangle-exclamation',info:'circle-info'}[t]||'circle-info')+'"></i>'+m;$('toasts').appendChild(e);if(b>0)setTimeout(()=>e.remove(),b)}

/* ===== STATUS ===== */
function sS(c,t){$('dot').className='dot'+(c?' '+c:'');$('lbl').textContent=t}
function sB(t,i,d){$('cT').textContent=t;$('cB').querySelector('i').className='fas '+i;$('cB').disabled=!!d}
function sH(html){$('st').innerHTML=html}

/* ===== TERMINAL ===== */
function initT(){
  term=new Terminal({
    theme:{background:'#0d1117',foreground:'#e6edf3',cursor:'#3fb950',cursorAccent:'#0d1117',selectionBackground:'rgba(63,185,80,.3)',black:'#484f58',red:'#f85149',green:'#3fb950',yellow:'#d29922',blue:'#58a6ff',magenta:'#bc8cff',cyan:'#39c5cf',white:'#e6edf3',brightBlack:'#6e7681',brightRed:'#ff7b72',brightGreen:'#56d364',brightYellow:'#e3b341',brightBlue:'#79c0ff',brightMagenta:'#d2a8ff',brightCyan:'#56d4dd',brightWhite:'#fff'},
    fontFamily:"'Fira Code','Consolas',monospace",fontSize:14,cursorBlink:true,cursorStyle:'block',scrollback:5000,allowProposedApi:true,allowTransparency:true
  });
  fitA=new FitAddon.FitAddon();
  term.loadAddon(fitA);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());
  term.open($('term'));fitA.fit();
  term.onData(d=>{if(alive&&devId)send({a:'i',to:devId,d})});
  term.onResize(({cols,rows})=>{if(alive&&devId)send({a:'r',to:devId,c:cols,rows})});
  window.addEventListener('resize',()=>{if(fitA)fitA.fit()});
  term.writeln('\x1b[36m  Termux Remote Controller\x1b[0m\n');
}
function fit(){if(fitA)setTimeout(()=>fitA.fit(),50)}

/* ===== WS ===== */
function send(d){if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify(d))}

function openWS(){
  if(ws)try{ws.close()}catch(e){}
  alive=false;hasDev=false;devId=null;

  const p=location.protocol==='https:'?'wss:':'ws:';
  const url=p+'//'+location.host+'/ws/b';
  sS('w','Connecting...');sB('...','fa-circle-notch fa-spin',true);
  sH('<div class="wait"><i class="fas fa-circle-dot"></i> Connecting to '+location.host+'...</div>');

  try{ws=new WebSocket(url)}catch(e){sS('','Error');sB('Retry','fa-rotate');sH('<div class="fail"><i class="fas fa-circle-xmark"></i> WebSocket error: '+e.message+'</div>');toast('WebSocket error','err',5000);schedR();return}

  const ct=setTimeout(()=>{if(!alive){try{ws.close()}catch(e){}sS('','Timeout');sB('Retry','fa-rotate');sH('<div class="fail"><i class="fas fa-circle-xmark"></i> Connection timeout (8s)</div>');toast('Timeout','err');schedR()}},8000);

  ws.onopen=()=>{
    clearTimeout(ct);alive=true;rCnt=0;
    startPoll();
    sS('w','Server OK');sB('Searching...','fa-magnifying-glass',false);
    sH('<div class="ok"><i class="fas fa-circle-check"></i> Connected to server</div><div class="wait" style="margin-top:4px"><i class="fas fa-circle-dot"></i> Looking for Termux device...</div>');
  };

  ws.onmessage=e=>{
    try{onMsg(JSON.parse(e.data))}catch(er){console.error(er)}
  };

  ws.onclose=()=>{
    clearTimeout(ct);stopPoll();alive=false;
    if(hasDev){
      devId=null;hasDev=false;startPoll();
      sS('w','Reconnecting...');
      $('ov').classList.remove('off');
      sH('<div class="ok"><i class="fas fa-circle-check"></i> Server OK</div><div class="fail" style="margin-top:4px"><i class="fas fa-circle-xmark"></i> Device disconnected</div>');
      toast('Device lost','warn',3000);
      if(term)term.writeln('\r\n\x1b[33m[!] Device disconnected\x1b[0m\r\n');
    } else {
      sS('w','Reconnecting...');
    }
    schedR();
  };

  ws.onerror=()=>{};
}

function closeWS(){stopPoll();if(ws)try{ws.close()}catch(e){}ws=null;alive=false}

function startPoll(){stopPoll();pollTmr=setInterval(()=>{if(alive&&!devId)send({a:'ls'})},3000)}
function stopPoll(){clearInterval(pollTmr);pollTmr=null}

function schedR(){
  stopPoll();
  rCnt++;
  const d=Math.min(2000+rCnt*800,8000);
  sS('','Retry '+Math.ceil(d/1000)+'s');sB('Retry','fa-circle-notch fa-spin',true);
  clearTimeout(rTmr);
  rTmr=setTimeout(openWS,d);
}

/* ===== MSG HANDLER ===== */
function onMsg(m){
  switch(m.t){
    case 'hi':
      // got our client id, nothing special
      break;
    case 'devs':
      if(devId)return;
      if(m.list&&m.list.length>0){pickDev(m.list[0])}
      else if(alive){showWait()}
      break;
    case 'dev_up':
      if(!devId)pickDev(m);
      else toast('New device: '+m.name,'info',3000);
      break;
    case 'dev_down':
      if(m.id===devId){
        devId=null;hasDev=false;startPoll();showWait();
        $('ov').classList.remove('off');
        if(term)term.writeln('\r\n\x1b[33m[!] Device disconnected\x1b[0m\r\n');
        toast('Device disconnected','warn');
      }
      break;
    case 'o':
      if(m.src===devId&&term)term.write(m.d);
      break;
    case 'res':
      handleRes(m);
      break;
    case 'fd':
      handleFD(m);
      break;
  }
}

function pickDev(d){
  devId=d.id;hasDev=true;stopPoll();
  sS('on','Device: '+d.name);sB('Connected','fa-check',false);
  $('ov').classList.add('off');
  toast('Connected: '+d.name,'ok');
  if(term){term.writeln('\x1b[32m[OK] '+d.name+'\x1b[0m\n')}
  setTimeout(()=>{if(term&&fitA){fitA.fit();send({a:'r',to:devId,c:term.cols,rows:term.rows})}},400);
}

function showWait(){
  sS('w','No device');sB('Waiting...','fa-magnifying-glass',false);
  sH('<div class="ok"><i class="fas fa-circle-check"></i> Server connected</div>'
    +'<div class="fail" style="margin-top:4px"><i class="fas fa-circle-xmark"></i> No Termux device found</div>'
    +'<div class="hint" style="margin-top:8px">Run on Termux: <code>bash ~/start_remote.sh</code><br><span style=\'opacity:.6\'>Auto-detecting every 3s...</span></div>');
}

/* ===== CONNECT ===== */
function go(){
  tk=$('tkI').value.trim();
  if(!tk){toast('Enter token','warn');return}
  rCnt=0;clearTimeout(rTmr);
  openWS();
}

/* ===== VIRTUAL KB ===== */
function togKB(){$('kb').classList.toggle('show');$('bK').classList.toggle('on');if($('kb').classList.contains('show'))setTimeout(fit,80)}
function tm(m,el){mods[m]=!mods[m];el.classList.toggle('on',mods[m])}
function sk(key){
  if(!alive||!devId){toast('No device','warn',1500);return}
  const c=mods.ctrl,a=mods.alt;mods.ctrl=mods.alt=false;
  document.querySelectorAll('.k[data-m]').forEach(e=>e.classList.remove('on'));
  let s='';
  if(c||a){const m={a:'\x01',b:'\x02',c:'\x03',d:'\x04',e:'\x05',f:'\x06',g:'\x07',h:'\x08',i:'\x09',j:'\x0a',k:'\x0b',l:'\x0c',m:'\x0d',n:'\x0e',o:'\x0f',p:'\x10',q:'\x11',r:'\x12',s:'\x13',t:'\x14',u:'\x15',v:'\x16',w:'\x17',x:'\x18',y:'\x19',z:'\x1a','[':'\x1b',']':'\x1d','\\':'\x1c','/':'\x1f',' ':'\x00','_':'\x1f'};const k=key.length===1?key.toLowerCase():null;if(c&&k&&m[k])s=m[k];else s=key}
  else{const q={Escape:'\x1b',Tab:'\t',Backspace:'\x7f',Delete:'\x1b[3~',Home:'\x1b[H',End:'\x1b[F',PageUp:'\x1b[5~',PageDown:'\x1b[6~',Insert:'\x1b[2~',Enter:'\r',ArrowUp:'\x1b[A',ArrowDown:'\x1b[B',ArrowLeft:'\x1b[D',ArrowRight:'\x1b[C',F1:'\x1bOP',F2:'\x1bOQ',F3:'\x1bOR',F4:'\x1bOS',F5:'\x1b[15~',F6:'\x1b[17~',F7:'\x1b[18~',F8:'\x1b[19~',F9:'\x1b[20~',F10:'\x1b[21~',F11:'\x1b[23~',F12:'\x1b[24~'};s=q[key]||key}
  send({a:'i',to:devId,d:s});
}

/* ===== FILES ===== */
function togFP(){if(!devId){toast('No device','warn');return}$('fp').classList.toggle('open');$('bF').classList.toggle('on');if($('fp').classList.contains('open'))fl()}
function fl(p){if(!devId)return;if(p===undefined)p=$('fpP').value;$('fpP').value=p;const id='r'+(++rc);pend[id]={t:'l'};$('fpB').innerHTML='<div class="fp-l"><div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0"></div> Loading...</div>';send({a:'fr',to:devId,p,m:'list',rid:id})}
function ff(){if(!devId)return;const p=$('fpP').value,q=prompt('Glob:','*');if(!q)return;const id='r'+(++rc);pend[id]={t:'f'};$('fpB').innerHTML='<div class="fp-l">Searching...</div>';send({a:'fr',to:devId,p,m:'find',q,rid:id})}
function fr(p){if(!devId)return;const id='r'+(++rc);pend[id]={t:'r',p};$('fpB').innerHTML='<div class="fp-l">Reading...</div>';send({a:'fr',to:devId,p,m:'read',rid:id})}
function fn(p){fl(p)}

function handleRes(m){
  const r=pend[m.rid];if(!r)return;delete pend[m.rid];const d=m.d;
  if(d.success===false){$('fpB').innerHTML='<div style="padding:12px;color:var(--rd);text-align:center;font-size:11px"><i class="fas fa-circle-xmark"></i> '+esc(d.error||'Error')+'</div>';toast(d.error||'Error','err');return}
  if(r.t==='l'||r.t==='f'){renderF(d.entries||[],d.path||'')}
  else if(r.t==='r'){$('fpB').innerHTML='';curPath=r.p;$('mT').textContent='Edit: '+r.p;$('mTa').value=d.content||'';$('mSv').onclick=()=>fSv(curPath);$('mbg').classList.add('show')}
  else if(r.t==='u'){toast(d.message||'Saved','ok');setTimeout(fl,300)}
}

function handleFD(m){
  const r=pend[m.rid];if(!r)return;delete pend[m.rid];const d=m.d;
  const b=new Blob([d.content],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.filename||'f';a.click();URL.revokeObjectURL(a.href);toast('Downloaded','ok')
}

function renderF(entries,path){
  const el=$('fpB');if(!entries.length){el.innerHTML='<div style="padding:12px;color:var(--dm);text-align:center;font-size:11px">Empty</div>';return}
  el.innerHTML=entries.map(f=>{const i=f.type==='dir'?'fa-folder':fI(f.name);const sz=f.type==='file'?fSz(f.size):'';const p=escP(path+'/'+f.name);const o=f.type==='dir'?"fn('"+p+"')":"fr('"+p+"')";return'<div class="fi '+(f.type==='dir'?'dir':'')+'" onclick="+o+'><i class="fas '+i+'"></i><span class="fn">'+esc(f.name)+'</span><span class="fs">'+sz+'</span></div>'}).join('')
}

function fU(){if(!devId)return;const i=document.createElement('input');i.type='file';i.onchange=e=>{const f=e.target.files[0];if(!f)return;toast('Uploading '+f.name,'info',2000);const r=new FileReader();r.onload=ev=>{const id='r'+(++rc);pend[id]={t:'u'};send({a:'fu',to:devId,p:$('fpP').value+'/'+f.name,c:ev.target.result,rid:id})};r.readAsText(f)};i.click()}
function fCr(){if(!devId)return;curPath=null;$('mT').textContent='Create File';$('mTa').value='';$('mSv').onclick=fCr2;$('mbg').classList.add('show')}
function fCr2(){const n=prompt('Name:');if(!n)return;const id='r'+(++rc);pend[id]={t:'u'};send({a:'fu',to:devId,p:$('fpP').value+'/'+n,c:$('mTa').value,rid:id});cm();toast('Creating...','info',1500)}
function fSv(p){const id='r'+(++rc);pend[id]={t:'u'};send({a:'fu',to:devId,p,c:$('mTa').value,rid:id});cm();toast('Saving...','info',1500)}
function cm(){$('mbg').classList.remove('show')}

/* ===== HELPERS ===== */
function fI(n){const e=n.split('.').pop().toLowerCase();const m={py:'fa-file-code',js:'fa-file-code',html:'fa-file-code',css:'fa-file-code',json:'fa-file-code',sh:'fa-file-code',ts:'fa-file-code',txt:'fa-file-lines',md:'fa-file-lines',jpg:'fa-file-image',png:'fa-file-image',gif:'fa-file-image',svg:'fa-file-image',zip:'fa-file-zipper',tar:'fa-file-zipper',gz:'fa-file-zipper',mp3:'fa-file-audio',mp4:'fa-file-video',pdf:'fa-file-pdf'};return m[e]||'fa-file'}
function fSz(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escP(p){return p.replace(/'/g,"\\'")}

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded',()=>{
  initT();
  const p=new URLSearchParams(location.search);
  if(p.get('token')){tk=p.get('token');$('tkI').value=tk}
  $('tkI').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!alive&&rCnt>0){clearTimeout(rTmr);openWS()}});
});
</script>
