<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Termux Remote</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--text-dim:#8b949e;--green:#3fb950;
  --red:#f85149;--yellow:#d29922;--blue:#58a6ff;
  --termux-green:#43a047;--termux-dark:#1a1a2e;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace;font-size:14px}

/* === Status Bar === */
#statusbar{height:36px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:12px;justify-content:space-between;flex-shrink:0}
#statusbar .left{display:flex;align-items:center;gap:10px}
#statusbar .title{font-size:13px;font-weight:600;color:var(--green)}
#statusbar .title i{margin-right:6px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:.3s}
.conn-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
#statusbar .right{display:flex;align-items:center;gap:8px}
#statusbar .right button{background:var(--border);border:none;color:var(--text);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;display:flex;align-items:center;gap:5px;transition:.2s}
#statusbar .right button:hover{background:#484f58}
#statusbar .right button.active{background:var(--green);color:#000}

/* === Main Layout === */
#main{display:flex;height:calc(100vh - 36px);position:relative}

/* === Terminal === */
#terminal-wrap{flex:1;position:relative;overflow:hidden}
#terminal{width:100%;height:100%;padding:4px 0}
.xterm{height:100%}
.xterm-viewport::-webkit-scrollbar{width:6px}
.xterm-viewport::-webkit-scrollbar-track{background:transparent}
.xterm-viewport::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

/* === File Panel === */
#filepanel{position:absolute;right:0;top:0;bottom:0;width:360px;background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .25s ease;z-index:20;display:flex;flex-direction:column}
#filepanel.open{transform:translateX(0)}
#filepanel .fp-header{height:40px;background:#1c2128;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;justify-content:space-between;flex-shrink:0}
#filepanel .fp-header h3{font-size:13px;font-weight:600}
#filepanel .fp-header button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px}
#filepanel .fp-header button:hover{color:var(--text)}
#filepanel .fp-toolbar{height:38px;background:#1c2128;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0}
#filepanel .fp-toolbar input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;font-family:inherit;outline:none}
#filepanel .fp-toolbar input:focus{border-color:var(--green)}
#filepanel .fp-toolbar button{background:var(--border);border:none;color:var(--text);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
#filepanel .fp-toolbar button:hover{background:#484f58}
#filepanel .fp-body{flex:1;overflow-y:auto;padding:4px 0}
.file-item{display:flex;align-items:center;padding:6px 12px;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.file-item:hover{background:rgba(255,255,255,.05)}
.file-item.selected{background:rgba(63,185,80,.1);border-left-color:var(--green)}
.file-item i{width:20px;text-align:center;margin-right:8px;font-size:13px}
.file-item .fname{flex:1;font-size:12px;word-break:break-all}
.file-item .fsize{font-size:11px;color:var(--text-dim);margin-left:8px}
.file-item.dir i{color:var(--blue)}
.file-item.file i{color:var(--text-dim)}

/* === File Action Modal === */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:90%;max-width:500px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
#modal .m-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#modal .m-header h3{font-size:14px}
#modal .m-header button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px}
#modal .m-body{padding:16px;overflow-y:auto;flex:1}
#modal textarea{width:100%;height:300px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:4px;font-family:inherit;font-size:12px;resize:vertical;outline:none}
#modal textarea:focus{border-color:var(--green)}
#modal .m-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#modal .m-footer button{padding:6px 16px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-size:12px}
#modal .btn-save{background:var(--green);color:#000}
#modal .btn-cancel{background:var(--border);color:var(--text)}

/* === Virtual Keyboard === */
#keyboard{display:none;height:auto;max-height:40vh;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:6px}
#keyboard.show{display:block}
.kb-row{display:flex;justify-content:center;gap:4px;margin-bottom:4px}
.kb-key{min-width:32px;height:36px;background:#21262d;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.1s;padding:0 8px;flex-shrink:0}
.kb-key:active,.kb-key.pressed{background:var(--green);color:#000;border-color:var(--green)}
.kb-key.special{background:#1c2128;color:var(--green);font-weight:600;font-size:11px}
.kb-key.special.active{background:var(--green);color:#000}
.kb-key.wide{min-width:56px}
.kb-key.xwide{min-width:80px}

/* === Connection Overlay === */
#connect-overlay{position:absolute;inset:0;background:rgba(13,17,23,.95);z-index:30;display:flex;align-items:center;justify-content:center}
#connect-overlay.hidden{display:none}
#connect-box{text-align:center;padding:32px}
#connect-box h2{margin-bottom:8px;color:var(--green);font-size:18px}
#connect-box p{color:var(--text-dim);font-size:13px;margin-bottom:20px}
#connect-box input{width:280px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-family:inherit;font-size:13px;outline:none;text-align:center;margin-bottom:12px}
#connect-box input:focus{border-color:var(--green)}
#connect-box button{padding:10px 32px;background:var(--green);color:#000;border:none;border-radius:6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
#connect-box button:hover{opacity:.9}
#connect-box .hint{margin-top:16px;font-size:11px;color:var(--text-dim);max-width:320px;line-height:1.5}

/* === Responsive === */
@media(max-width:600px){
  #filepanel{width:100%}
  .kb-key{min-width:28px;height:34px;font-size:11px}
  .kb-key.special{font-size:10px}
}
</style>
</head>
<body>

<!-- Status Bar -->
<div id="statusbar">
  <div class="left">
    <div class="conn-dot" id="connDot"></div>
    <span class="title"><i class="fas fa-terminal"></i> Termux Remote</span>
    <span id="deviceLabel" style="color:var(--text-dim);font-size:12px">No device</span>
  </div>
  <div class="right">
    <button id="btnKb" onclick="toggleKeyboard()" title="Virtual Keyboard"><i class="fas fa-keyboard"></i> Keys</button>
    <button id="btnFm" onclick="toggleFilePanel()" title="File Manager"><i class="fas fa-folder"></i> Files</button>
    <button onclick="fitTerminal()" title="Fit Terminal"><i class="fas fa-expand"></i></button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <!-- Terminal -->
  <div id="terminal-wrap">
    <div id="terminal"></div>

    <!-- Connection Overlay -->
    <div id="connect-overlay">
      <div id="connect-box">
        <h2><i class="fas fa-link"></i> Termux Remote</h2>
        <p>Connect to your Termux device</p>
        <input type="text" id="tokenInput" placeholder="Enter auth token" value="termux-remote-2024">
        <br>
        <button onclick="connectTermux()">Connect</button>
        <div class="hint">
          Token must match between Railway server and Termux client.<br>
          Set AUTH_TOKEN env var on Railway.
        </div>
      </div>
    </div>
  </div>

  <!-- File Panel -->
  <div id="filepanel">
    <div class="fp-header">
      <h3><i class="fas fa-folder-open"></i> File Manager</h3>
      <button onclick="toggleFilePanel()"><i class="fas fa-times"></i></button>
    </div>
    <div class="fp-toolbar">
      <input type="text" id="pathInput" value="~" placeholder="Path">
      <button onclick="fileList()"><i class="fas fa-sync-alt"></i></button>
      <button onclick="fileFind()"><i class="fas fa-search"></i> Find</button>
      <button onclick="showUploadModal()"><i class="fas fa-upload"></i></button>
      <button onclick="showCreateModal()"><i class="fas fa-plus"></i></button>
    </div>
    <div class="fp-body" id="fileList"></div>
  </div>
</div>

<!-- Virtual Keyboard -->
<div id="keyboard">
  <div class="kb-row">
    <div class="kb-key special" data-key="Escape" onclick="sendKey('Escape')">ESC</div>
    <div class="kb-key special" data-key="Tab" onclick="sendKey('Tab')">TAB</div>
    <div class="kb-key special" data-mod="ctrl" onclick="toggleMod('ctrl',this)">Ctrl</div>
    <div class="kb-key special" data-mod="alt" onclick="toggleMod('alt',this)">Alt</div>
    <div class="kb-key wide" onclick="sendKey('Backspace')"><i class="fas fa-delete-left"></i></div>
    <div class="kb-key special" onclick="sendKey('End')">End</div>
    <div class="kb-key special" onclick="sendKey('Home')">Home</div>
    <div class="kb-key special" onclick="sendKey('PageUp')">PgUp</div>
    <div class="kb-key special" onclick="sendKey('PageDown')">PgDn</div>
  </div>
  <div class="kb-row">
    <div class="kb-key special" onclick="sendKey('F1')">F1</div>
    <div class="kb-key special" onclick="sendKey('F2')">F2</div>
    <div class="kb-key special" onclick="sendKey('F3')">F3</div>
    <div class="kb-key special" onclick="sendKey('F4')">F4</div>
    <div class="kb-key special" onclick="sendKey('F5')">F5</div>
    <div class="kb-key special" onclick="sendKey('F6')">F6</div>
    <div class="kb-key special" onclick="sendKey('F7')">F7</div>
    <div class="kb-key special" onclick="sendKey('F8')">F8</div>
    <div class="kb-key special" onclick="sendKey('F9')">F9</div>
    <div class="kb-key special" onclick="sendKey('F10')">F10</div>
  </div>
  <div class="kb-row">
    <div class="kb-key special" onclick="sendKey('F11')">F11</div>
    <div class="kb-key special" onclick="sendKey('F12')">F12</div>
    <div class="kb-key special" onclick="sendKey('Insert')">Ins</div>
    <div class="kb-key special" onclick="sendKey('Delete')">Del</div>
    <div class="kb-key" onclick="sendKey('`')">`</div>
    <div class="kb-key" onclick="sendKey('~')">~</div>
    <div class="kb-key" onclick="sendKey('|')">|</div>
    <div class="kb-key" onclick="sendKey('\\')">\\</div>
  </div>
  <div class="kb-row">
    <div class="kb-key" onclick="sendKey('ArrowUp')"><i class="fas fa-arrow-up"></i></div>
    <div class="kb-key" onclick="sendKey('ArrowDown')"><i class="fas fa-arrow-down"></i></div>
    <div class="kb-key" onclick="sendKey('ArrowLeft')"><i class="fas fa-arrow-left"></i></div>
    <div class="kb-key" onclick="sendKey('ArrowRight')"><i class="fas fa-arrow-right"></i></div>
    <div class="kb-key xwide special" onclick="sendKey('Enter')">Enter</div>
    <div class="kb-key wide" onclick="sendKey(' ')">Space</div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div class="m-header">
      <h3 id="modalTitle">Edit File</h3>
      <button onclick="closeModal()">&times;</button>
    </div>
    <div class="m-body">
      <textarea id="modalTextarea" placeholder="Content..."></textarea>
    </div>
    <div class="m-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="modalSaveBtn" onclick="modalSave()">Save</button>
    </div>
  </div>
</div>

<!-- xterm.js -->
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xtermAddonFit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xtermAddonWebLinks.min.js"></script>

<script>
// ========== State ==========
let ws = null;
let term = null;
let fitAddon = null;
let authToken = 'termux-remote-2024';
let deviceId = null;
let activeMods = { ctrl: false, alt: false };
let pendingReq = {};
let reqCounter = 0;
let currentFilePath = null;

// ========== Terminal Init ==========
function initTerminal() {
  term = new Terminal({
    theme: {
      background: '#0d1117',
      foreground: '#e6edf3',
      cursor: '#3fb950',
      cursorAccent: '#0d1117',
      selectionBackground: 'rgba(63,185,80,0.3)',
      black: '#484f58', red: '#f85149', green: '#3fb950',
      yellow: '#d29922', blue: '#58a6ff', magenta: '#bc8cff',
      cyan: '#39c5cf', white: '#e6edf3',
      brightBlack: '#6e7681', brightRed: '#ff7b72',
      brightGreen: '#56d364', brightYellow: '#e3b341',
      brightBlue: '#79c0ff', brightMagenta: '#d2a8ff',
      brightCyan: '#56d4dd', brightWhite: '#ffffff'
    },
    fontFamily: "'Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace",
    fontSize: 14,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 5000,
    allowProposedApi: true,
    allowTransparency: true
  });

  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());

  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  // Send keystrokes to server
  term.onData(data => {
    if (!ws || !deviceId) return;
    send({ action: 'input', data: data, target: deviceId });
  });

  // Resize
  term.onResize(({ cols, rows }) => {
    if (!ws || !deviceId) return;
    send({ action: 'resize', cols, rows, target: deviceId });
  });

  window.addEventListener('resize', () => fitAddon.fit());
}

// ========== WebSocket ==========
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/browser`);

  ws.onopen = () => {
    setConn(true);
    send({ action: 'list_devices' });
  };

  ws.onmessage = e => {
    try { handleMsg(JSON.parse(e.data)); } catch(err) { console.error(err); }
  };

  ws.onclose = () => {
    setConn(false);
    deviceId = null;
    document.getElementById('deviceLabel').textContent = 'Disconnected';
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => ws.close();
}

function handleMsg(msg) {
  switch(msg.type) {
    case 'init':
      // browser client initialized
      break;
    case 'devices':
      if (msg.devices && msg.devices.length > 0 && !deviceId) {
        selectDevice(msg.devices[0].id);
      }
      break;
    case 'device_connected':
      if (!deviceId) selectDevice(msg.device.id);
      break;
    case 'device_disconnected':
      if (msg.device_id === deviceId) {
        deviceId = null;
        document.getElementById('deviceLabel').textContent = 'Device lost';
        term.write('\r\n\x1b[33m[!] Device disconnected. Waiting...\x1b[0m\r\n');
      }
      break;
    case 'output':
      if (msg.source === deviceId && term) {
        term.write(msg.data);
      }
      break;
    case 'result':
      handleResult(msg);
      break;
    case 'file_data':
      handleFileData(msg);
      break;
    case 'error':
      if (term) term.write(`\r\n\x1b[31m[Error] ${msg.msg}\x1b[0m\r\n`);
      break;
  }
}

function selectDevice(id) {
  deviceId = id;
  document.getElementById('deviceLabel').textContent = `Device: ${id}`;
  document.getElementById('connect-overlay').classList.add('hidden');
  // Send initial resize
  if (term && fitAddon) {
    setTimeout(() => {
      send({ action: 'resize', cols: term.cols, rows: term.rows, target: deviceId });
    }, 200);
  }
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    data.token = authToken;
    ws.send(JSON.stringify(data));
  }
}

function setConn(on) {
  document.getElementById('connDot').classList.toggle('on', on);
}

// ========== Virtual Keyboard ==========
function toggleKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.classList.toggle('show');
  document.getElementById('btnKb').classList.toggle('active');
  if (kb.classList.contains('show')) fitTerminal();
}

function toggleMod(mod, el) {
  activeMods[mod] = !activeMods[mod];
  el.classList.toggle('active', activeMods[mod]);
}

function sendKey(key) {
  if (!ws || !deviceId) return;

  const mod = {};
  if (activeMods.ctrl) mod.ctrlKey = true;
  if (activeMods.alt) mod.altKey = true;

  // Reset modifiers after sending
  activeMods.ctrl = false;
  activeMods.alt = false;
  document.querySelectorAll('.kb-key.special[data-mod]').forEach(el => el.classList.remove('active'));

  // Build terminal sequence
  let seq = '';
  if (mod.ctrlKey || mod.altKey) {
    const keyMap = {
      'a':'\x01','b':'\x02','c':'\x03','d':'\x04','e':'\x05','f':'\x06',
      'g':'\x07','h':'\x08','i':'\x09','j':'\x0a','k':'\x0b','l':'\x0c',
      'm':'\x0d','n':'\x0e','o':'\x0f','p':'\x10','q':'\x11','r':'\x12',
      's':'\x13','t':'\x14','u':'\x15','v':'\x16','w':'\x17','x':'\x18',
      'y':'\x19','z':'\x1a','[':'\x1b',']':'\x1d','\\':'\x1c','/':'\x1f',
      ' ':'\x00','_':'\x1f'
    };
    const baseKey = key.length === 1 ? key.toLowerCase() : null;
    if (mod.ctrlKey && baseKey && keyMap[baseKey]) {
      seq = keyMap[baseKey];
    } else if (key.startsWith('F') && key.length <= 3) {
      const fnum = parseInt(key.slice(1));
      seq = fnum <= 10 ? `\x1bO${fnum === 10 ? '0' : String(fnum-1+48)}` : `\x1b[${fnum-10+33}~`;
    } else {
      seq = key;
    }
  } else {
    const keySeqs = {
      'Escape':'\x1b','Tab':'\t','Backspace':'\x7f','Delete':'\x1b[3~',
      'Home':'\x1b[H','End':'\x1b[F','PageUp':'\x1b[5~','PageDown':'\x1b[6~',
      'Insert':'\x1b[2~','Enter':'\r',
      'ArrowUp':'\x1b[A','ArrowDown':'\x1b[B','ArrowLeft':'\x1b[D','ArrowRight':'\x1b[C',
      'F1':'\x1bOP','F2':'\x1bOQ','F3':'\x1bOR','F4':'\x1bOS',
      'F5':'\x1b[15~','F6':'\x1b[17~','F7':'\x1b[18~','F8':'\x1b[19~',
      'F9':'\x1b[20~','F10':'\x1b[21~','F11':'\x1b[23~','F12':'\x1b[24~'
    };
    seq = keySeqs[key] || key;
  }
  send({ action: 'input', data: seq, target: deviceId });
}

// ========== File Manager ==========
function toggleFilePanel() {
  document.getElementById('filepanel').classList.toggle('open');
  document.getElementById('btnFm').classList.toggle('active');
  if (document.getElementById('filepanel').classList.contains('open')) {
    fileList();
  }
}

function fileList(path) {
  if (path === undefined) path = document.getElementById('pathInput').value;
  document.getElementById('pathInput').value = path;
  const reqId = 'req_' + (++reqCounter);
  pendingReq[reqId] = { type: 'list' };
  send({ action: 'file_req', path, mode: 'list', req_id: reqId, target: deviceId });
}

function fileFind() {
  const path = document.getElementById('pathInput').value;
  const query = prompt('Find files matching (glob):', '*');
  if (!query) return;
  const reqId = 'req_' + (++reqCounter);
  pendingReq[reqId] = { type: 'find' };
  send({ action: 'file_req', path, mode: 'find', query, req_id: reqId, target: deviceId });
}

function fileRead(path) {
  const reqId = 'req_' + (++reqCounter);
  pendingReq[reqId] = { type: 'read', path };
  send({ action: 'file_req', path, mode: 'read', req_id: reqId, target: deviceId });
}

function fileNavigate(path) {
  fileList(path);
}

function handleResult(msg) {
  const req = pendingReq[msg.req_id];
  if (!req) return;
  delete pendingReq[msg.req_id];

  const data = msg.data;
  if (data.success === false) {
    alert('Error: ' + (data.error || 'Unknown error'));
    return;
  }

  if (req.type === 'list' || req.type === 'find') {
    renderFileList(data.entries || [], data.path || '');
  } else if (req.type === 'read') {
    currentFilePath = req.path;
    document.getElementById('modalTitle').textContent = 'Edit: ' + req.path;
    document.getElementById('modalTextarea').value = data.content || '';
    document.getElementById('modalSaveBtn').onclick = () => fileSave(currentFilePath);
    document.getElementById('modal-overlay').classList.add('show');
  }
}

function handleFileData(msg) {
  const req = pendingReq[msg.req_id];
  if (!req) return;
  delete pendingReq[msg.req_id];
  const data = msg.data;
  // Download file
  const blob = new Blob([data.content], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = data.filename || 'download';
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderFileList(entries, path) {
  const el = document.getElementById('fileList');
  if (!entries || entries.length === 0) {
    el.innerHTML = '<div style="padding:16px;color:var(--text-dim);text-align:center">Empty directory</div>';
    return;
  }
  el.innerHTML = entries.map(f => {
    const icon = f.type === 'dir' ? 'fa-folder' : getFileIcon(f.name);
    const size = f.type === 'file' ? formatSize(f.size) : '';
    const onclick = f.type === 'dir'
      ? `fileNavigate('${escapePath(path)}/${escapePath(f.name)}')`
      : `fileRead('${escapePath(path)}/${escapePath(f.name)}')`;
    return `<div class="file-item ${f.type}" onclick="${onclick}">
      <i class="fas ${icon}"></i>
      <span class="fname">${escapeHtml(f.name)}</span>
      <span class="fsize">${size}</span>
    </div>`;
  }).join('');
}

function showUploadModal() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const path = document.getElementById('pathInput').value + '/' + file.name;
      const reqId = 'req_' + (++reqCounter);
      pendingReq[reqId] = { type: 'upload' };
      send({ action: 'file_upload', path, content: ev.target.result, req_id: reqId, target: deviceId });
    };
    reader.readAsText(file);
  };
  input.click();
}

function showCreateModal() {
  currentFilePath = null;
  document.getElementById('modalTitle').textContent = 'Create File';
  document.getElementById('modalTextarea').value = '';
  document.getElementById('modalSaveBtn').onclick = createFile;
  document.getElementById('modal-overlay').classList.add('show');
}

function createFile() {
  const name = prompt('File name:');
  if (!name) return;
  const path = document.getElementById('pathInput').value + '/' + name;
  const content = document.getElementById('modalTextarea').value;
  const reqId = 'req_' + (++reqCounter);
  pendingReq[reqId] = { type: 'upload' };
  send({ action: 'file_upload', path, content, req_id: reqId, target: deviceId });
  closeModal();
  setTimeout(fileList, 500);
}

function fileSave(path) {
  const content = document.getElementById('modalTextarea').value;
  const reqId = 'req_' + (++reqCounter);
  pendingReq[reqId] = { type: 'upload' };
  send({ action: 'file_upload', path, content, req_id: reqId, target: deviceId });
  closeModal();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function fitTerminal() {
  if (fitAddon) setTimeout(() => fitAddon.fit(), 50);
}

// ========== Helpers ==========
function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const icons = {
    py:'fa-file-code',js:'fa-file-code',html:'fa-file-code',css:'fa-file-code',
    json:'fa-file-code',sh:'fa-file-code',js:'fa-file-code',ts:'fa-file-code',
    txt:'fa-file-lines',md:'fa-file-lines',log:'fa-file-lines',
    jpg:'fa-file-image',png:'fa-file-image',gif:'fa-file-image',svg:'fa-file-image',
    zip:'fa-file-zipper',tar:'fa-file-zipper',gz:'fa-file-zipper',
    mp3:'fa-file-audio',mp4:'fa-file-video',apk:'fa-file',
    pdf:'fa-file-pdf',doc:'fa-file-word',xls:'fa-file-excel'
  };
  return icons[ext] || 'fa-file';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapePath(p) {
  return p.replace(/'/g, "\\'");
}

function connectTermux() {
  authToken = document.getElementById('tokenInput').value.trim();
  if (ws) ws.close();
  connectWS();
}

// ========== Init ==========
window.addEventListener('DOMContentLoaded', () => {
  initTerminal();
  // Auto-connect
  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get('token')) {
    authToken = urlParams.get('token');
    document.getElementById('tokenInput').value = authToken;
  }
  connectWS();
});
</script>
